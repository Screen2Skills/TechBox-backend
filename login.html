<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechBox Login</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Space Grotesk",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f7fcff;
}

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:#73d5ff;
    filter:blur(120px);
    opacity:.25;
    top:-200px;
    left:-150px;
}

.card{
    width:420px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(20px);
    border:1px solid #d9f1fb;
    border-radius:25px;
    padding:40px;
    box-shadow:0 20px 60px rgba(40,140,185,.08);
}

.logo{
    text-align:center;
    font-family:"Orbitron";
    font-size:34px;
    font-weight:800;
    margin-bottom:10px;
    color:#143650;
}

.logo span{
    color:#20a9e5;
}

.subtitle{
    text-align:center;
    color:#6f8698;
    margin-bottom:30px;
}

.input{
    width:100%;
    padding:15px;
    border:1px solid #d9eef8;
    border-radius:14px;
    margin-bottom:15px;
    font-size:15px;
}

.btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:14px;
    cursor:pointer;
    font-weight:600;
    color:white;
    background:linear-gradient(135deg,#25b5ed,#158dde);
}

.switch{
    text-align:center;
    margin-top:18px;
}

.switch a{
    color:#159bd6;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        TECH<span>BOX</span>
    </div>

    <div class="subtitle">
        Login to your account
    </div>

    <input type="email" id="email" class="input" placeholder="Email Address">

    <button class="btn" onclick="sendOTP()">
        Send OTP
    </button>

    <div class="switch">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
    </div>

</div>

<script>
async function sendOTP(){

    const email =
        document.getElementById("email").value;

    const response =
        await fetch(
            "http://localhost:5000/api/auth/send-otp",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({email})
            }
        );

    const data = await response.json();

    alert(data.message);
}
</script>

</body>
</html>
